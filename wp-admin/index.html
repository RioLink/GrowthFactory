<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In &lsaquo; GrowthFactory &#8212; WordPress</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;font-size:13px;color:#3c434a;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:60px 12px}
#login{width:320px}
.wp-logo{text-align:center;margin-bottom:25px}
.wp-logo a{display:inline-block;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.52 122.523"><circle cx="61.26" cy="61.261" r="61.26" fill="%23464646"/><path d="M8.708 61.26c0 20.803 12.09 38.836 29.605 47.399L13.605 40.97A52.5 52.5 0 008.708 61.26zM96.74 58.608c0-6.495-2.333-10.993-4.334-14.494-2.664-4.329-5.161-7.995-5.161-12.324 0-4.831 3.664-9.328 8.825-9.328.233 0 .454.029.681.042a52.4 52.4 0 00-35.294-13.655C43.221 8.849 27.11 17.46 17.19 30.958c.833.026 1.618.042 2.283.042 3.706 0 9.44-.45 9.44-.45 1.909-.112 2.134 2.692.226 2.91 0 0-1.919.225-4.054.336l12.896 38.38 7.751-23.25-5.515-15.13c-1.909-.111-3.717-.336-3.717-.336-1.91-.112-1.686-3.023.222-2.91 0 0 5.857.45 9.337.45 3.706 0 9.44-.45 9.44-.45 1.91-.112 2.135 2.692.226 2.91 0 0-1.921.225-4.054.336l12.797 38.086 3.533-11.795c1.53-4.895 2.694-8.41 2.694-11.44zM62.184 65.857l-10.624 30.86a52.58 52.58 0 0030.554-.791 4.655 4.655 0 01-.371-.726zm45.384-29.94a52.507 52.507 0 01.416 6.355c0 6.271-1.173 13.318-4.671 22.14l-18.77 54.27c18.268-10.654 30.57-30.484 30.57-53.22a52.5 52.5 0 00-7.545-29.544z" fill="%23fff"/></svg>');background-size:84px;width:84px;height:84px;background-repeat:no-repeat;text-indent:-9999px}
#loginform{background:#fff;border:1px solid #c3c4c7;border-bottom:none;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:26px 24px 20px}
#loginform p{margin-bottom:16px}
#loginform label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#3c434a}
#loginform input[type=text],#loginform input[type=password]{width:100%;padding:8px 10px;border:1px solid #8c8f94;border-radius:4px;font-size:15px;color:#2c3338;outline:none;transition:border-color .15s}
#loginform input[type=text]:focus,#loginform input[type=password]:focus{border-color:#2271b1;box-shadow:0 0 0 1px #2271b1}
.forgetmenot{display:flex;align-items:center;gap:6px;font-size:13px}
.forgetmenot input{width:16px;height:16px;accent-color:#2271b1}
#wp-submit{width:100%;padding:9px 0;background:#2271b1;border:1px solid #2271b1;border-radius:3px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
#wp-submit:hover{background:#135e96;border-color:#135e96}
#nav,#backtoblog{background:#fff;border:1px solid #c3c4c7;border-top:none;padding:10px 24px;font-size:12px}
#nav{display:flex;justify-content:space-between;border-bottom:none}
#backtoblog{border-top:1px solid #c3c4c7;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#nav a,#backtoblog a{color:#2271b1;text-decoration:none}
#nav a:hover,#backtoblog a:hover{color:#135e96;text-decoration:underline}
#login_error{border-left:4px solid #d63638;background:#f0f6fc;border-radius:0 3px 3px 0;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#3c434a;display:none}
.pw-show{position:relative}
.pw-show input{padding-right:36px}
.toggle-pw{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#646970;font-size:17px;line-height:1}
#language-switcher{margin-top:16px;text-align:center}
#language-switcher select{border:1px solid #8c8f94;border-radius:3px;padding:4px 8px;font-size:12px;color:#3c434a;background:#fff}
.wp-version{margin-top:20px;text-align:center;color:#646970;font-size:11px}
</style>
</head>
<body>
<div id="login">
  <div class="wp-logo"><a href="#" tabindex="-1">WordPress</a></div>

  <div id="login_error">&#9888; <strong>Error</strong>: The password you entered is incorrect. <a href="#">Lost your password?</a></div>

  <form name="loginform" id="loginform" action="#" method="post">
    <p>
      <label for="user_login">Username or Email Address</label>
      <input type="text" name="log" id="user_login" autocomplete="username" value="" size="20">
    </p>
    <p>
      <label for="user_pass">Password</label>
      <div class="pw-show">
        <input type="password" name="pwd" id="user_pass" autocomplete="current-password" size="20">
        <button type="button" class="toggle-pw" aria-label="Show password" onclick="var i=document.getElementById('user_pass');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁':'🙈'">👁</button>
      </div>
    </p>
    <p class="forgetmenot">
      <input name="rememberme" type="checkbox" id="rememberme" value="forever">
      <label for="rememberme">Remember Me</label>
    </p>
    <p class="submit">
      <input type="submit" name="wp-submit" id="wp-submit" value="Log In">
      <input type="hidden" name="redirect_to" value="/wp-admin/">
      <input type="hidden" name="testcookie" value="1">
    </p>
  </form>

  <p id="nav">
    <a href="#">Lost your password?</a>
    <a href="#">Register</a>
  </p>
  <p id="backtoblog"><a href="/">&#8592; Go to GrowthFactory</a></p>

  <div id="language-switcher">
    <select name="language"><option value="en_US" selected>English (United States)</option><option value="uk">Українська</option></select>
  </div>
  <p class="wp-version">WordPress 6.5.3</p>
</div>
<script>
document.getElementById('loginform').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('user_login').value;
  var p=document.getElementById('user_pass').value;
  if(!u||!p){document.getElementById('login_error').style.display='block';return;}
  document.getElementById('login_error').style.display='block';
});
</script>
</body>
</html>
